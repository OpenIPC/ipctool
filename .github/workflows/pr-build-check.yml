name: PR Build Check

on:
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build ${{ matrix.target }} (musl static)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm32
            toolchain_url: https://github.com/OpenIPC/firmware/releases/download/toolchain/toolchain.hisilicon-hi3516cv100.tgz
            toolchain_dir: arm-openipc-linux-musleabi_sdk-buildroot
            cc: arm-openipc-linux-musleabi-gcc
          - target: mips32
            toolchain_url: https://github.com/OpenIPC/firmware/releases/download/toolchain/toolchain.ingenic-t31.tgz
            toolchain_dir: mipsel-openipc-linux-musl_sdk-buildroot
            cc: mipsel-openipc-linux-musl-gcc
          - target: arm64
            # Bootlin's prebuilt aarch64 musl cross toolchain. Switch
            # to an OpenIPC-hosted tarball once one is published.
            toolchain_url: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2025.08-1.tar.xz
            toolchain_dir: aarch64--musl--stable-2025.08-1
            cc: aarch64-buildroot-linux-musl-gcc
    steps:
      - uses: actions/checkout@v5
        with:
          # The size step below builds the PR's base commit as well as its
          # head, so the history has to be there to check out.
          fetch-depth: 0
      - name: Fetch toolchain
        run: |
          # Download to file (with retries) before extracting — piping
          # wget -> tar makes transient stream truncations look like
          # corrupt archives; the wget retry only helps with discrete
          # files.
          wget --tries=3 --timeout=60 -O /tmp/toolchain.tar "${{ matrix.toolchain_url }}"
          # `tar xf` autodetects gzip/bzip2/xz so the matrix entries
          # can mix archive formats freely.
          tar xf /tmp/toolchain.tar -C /opt
          rm /tmp/toolchain.tar
      - name: Build
        run: |
          export PATH=/opt/${{ matrix.toolchain_dir }}/bin:$PATH
          cmake -H. -Bbuild -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: ipcinfo size
        # ipcinfo ships on all but three of the OpenIPC firmware tree's board
        # configs, onto cameras whose rootfs cap leaves tens of KB spare, and
        # nothing here measured it until now -- the job above builds a static
        # binary, which is not what those images carry.
        #
        # The configure below reproduces the firmware package's: shared libs
        # (which is what drops the global -static), SKIP_VERSION, and
        # CMAKE_C_FLAGS_RELEASE cleared. That last one matters. CMake appends
        # its own "-O3 -DNDEBUG" after CMAKE_C_FLAGS, so a plain Release
        # configure silently measures -O3; Buildroot's toolchain file clears
        # the variable, which is why the firmware genuinely gets the -Os this
        # file asks for.
        #
        # The comparison is against the PR's base commit, not a number written
        # down here. This job's toolchain is not one any camera is built with
        # -- it is whatever toolchain.hisilicon-hi3516cv100.tgz ships, and it
        # produces an ipcinfo some 12 KB larger than the gcc 13.3 toolchains
        # the boards use -- so an absolute ceiling here would describe no
        # shipped binary and would go stale the moment that URL moves. A
        # delta does not care which compiler measured it.
        if: matrix.target == 'arm32'
        run: |
          export PATH=/opt/${{ matrix.toolchain_dir }}/bin:$PATH
          measure() {
            out=$(mktemp -d)
            cmake -H"$1" -B"$out" -DCMAKE_C_COMPILER=${{ matrix.cc }} \
                  -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE=" -DNDEBUG" \
                  -DBUILD_SHARED_LIBS=ON -DSKIP_VERSION=ON \
                  -DIPCHW_VENDORS="$2" > /dev/null
            cmake --build "$out" --target ipcinfo > /dev/null
            stat -c %s "$out/ipcinfo"
          }
          git worktree add -f /tmp/ipcinfo-base \
              "${{ github.event.pull_request.base.sha }}" > /dev/null
          status=0
          # "all" is what the firmware tree builds today; "none" is what it
          # builds once its ipctool.mk passes the knob added in #178.
          for vendors in all none; do
            base=$(measure /tmp/ipcinfo-base "$vendors")
            head=$(measure . "$vendors")
            delta=$((head - base))
            echo "ipcinfo, IPCHW_VENDORS=$vendors: $base -> $head ($delta bytes)"
            if [ "$delta" -gt 1024 ]; then
              echo "::error::ipcinfo (IPCHW_VENDORS=$vendors) grows $delta bytes. Over the 1024-byte budget: say in the PR why the camera should carry it."
              status=1
            elif [ "$delta" -gt 0 ]; then
              echo "::warning::ipcinfo (IPCHW_VENDORS=$vendors) grows $delta bytes."
            fi
          done
          exit $status

  test-extraction-pipeline:
    name: Test sensor extraction pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run end-to-end pipeline smoke test
        run: tools/test_pipeline.sh

  unit-tests:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the pipeline suite is still wired in
        # Deliberately NOT inside test_pipeline.sh: a check that only runs
        # once the thing it protects has already run protects nothing.
        # It lives in this job rather than test-extraction-pipeline for the
        # same reason -- both jobs are required, so dropping that job's step
        # leaves this one still failing.
        # Matches a run: line and nothing else. A bare grep for the script
        # name finds this very step's own text and can never fail.
        run: |
          grep -qE '^[[:space:]]*run:[[:space:]]*tools/test_pipeline\.sh[[:space:]]*$' \
              .github/workflows/pr-build-check.yml \
            || { echo "no job in this workflow runs tools/test_pipeline.sh"; exit 1; }
      - name: Build and run
        run: |
          cmake -H. -Bbuild -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target cYAML_test reginfo_test longse_test
          ./build/cYAML_test
          ./build/reginfo_test
          ./build/longse_test
      - name: Build trimmed, and run again
        # The pad tables are the largest thing in libipchw and a consumer
        # picks the families it targets. Prove the trimmed configure
        # compiles and that reginfo_test still passes when most of the
        # tables are not there.
        run: |
          cmake -H. -Bbuild-trimmed -DCMAKE_BUILD_TYPE=Release \
                -DIPCHW_VENDORS=none -DIPCHW_PADMUX=v1
          cmake --build build-trimmed --target reginfo_test
          ./build-trimmed/reginfo_test
